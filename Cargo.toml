[package]
name = "lazy-mouse"
version = "0.2.2"
edition = "2024"

[dependencies]
tiny-skia = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",

    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }



[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
