name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package exe
        id: pack
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $bin = ($meta.packages[0].targets | Where-Object { $_.kind -contains 'bin' })[0].name
          $ver = $meta.packages[0].version
          $out = "$bin-$ver.exe"
          Copy-Item "$($meta.target_directory)/release/$bin.exe" $out
          "asset=$out" >> $env:GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.pack.outputs.asset }}